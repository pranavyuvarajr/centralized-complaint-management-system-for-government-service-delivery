# =============================================
# Complaint Management System - Configuration
# All values are overridable via environment variables for cloud deployment.
# =============================================

server.address = 0.0.0.0

spring.application.name=complaint-management

# --- Database ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-nameless-truth-azo5bjvu-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${DATABASE_PASSWORD:npg_A0YGEKyIrM5T}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# ddl-auto stays "update" so the schema evolves automatically - no manual migrations needed.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Server ---
server.port=${PORT:8080}

# --- JWT ---
app.jwt.secret=${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
app.cors.allowed-origins=${CORS_ORIGINS:https://centralized-complaint-management.vercel.app}

# --- File Uploads ---
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Actuator (used by cloud platforms for health checks) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
