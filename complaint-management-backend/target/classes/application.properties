# =============================================
# Complaint Management System - Configuration
# All values are overridable via environment variables for cloud deployment.
# =============================================

spring.application.name=complaint-management

# --- Database (Neon PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://ep-orange-sea-b5og3zzr-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_TU2psvE5ftDF
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# ddl-auto stays "update" so the schema evolves automatically - no manual migrations needed.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Server ---
server.port=${PORT:8080}

# --- JWT ---
app.jwt.secret=${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- File Uploads ---
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Actuator (used by cloud platforms for health checks) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Location search (complaint form) ---
# provider: which geocoder is asked first: photon (default, built for search-as-you-type) or nominatim.
# The other one is used as a fallback and to fill in when the first returns very few results.
# Point the URLs at your own instances if you self-host. country-codes = preferred countries
# (comma-separated ISO codes, e.g. "in"); leave empty for worldwide.
app.geocoder.provider=${GEOCODER_PROVIDER:photon}
app.geocoder.photon-url=${GEOCODER_PHOTON_URL:https://photon.komoot.io}
app.geocoder.nominatim-url=${GEOCODER_NOMINATIM_URL:https://nominatim.openstreetmap.org}
app.geocoder.country-codes=${GEOCODER_COUNTRY_CODES:in}

# --- Mail / alerts (urgent complaints, alert-email verification) ---
# app.mail.enabled=false (default) = log-only mode: emails and their links are written to the log, nothing is sent.
# Link base used inside emails (verification and urgent alerts).
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@localhost}

# SMTP (only used when app.mail.enabled=true). Example: Brevo SMTP relay.
#   MAIL_HOST=smtp-relay.brevo.com  MAIL_PORT=587  (STARTTLS)  MAIL_USERNAME=<Brevo SMTP login>  MAIL_PASSWORD=<Brevo SMTP key>
#   MAIL_FROM must be a sender verified in Brevo. Some hosts block outbound SMTP ports; if so use another provider/port.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# A slow or unreachable SMTP server must never make the cloud health check fail.
management.health.mail.enabled=false

# --- Urgent complaint reminders ---
# Production schedule: reminders at +6h, +12h, +18h, +24h, admin escalation 5 minutes after the 4th.
# Shorten for testing, e.g. URGENCY_REMINDER_INTERVAL=PT1M and URGENCY_ESCALATION_DELAY=PT20S.
app.urgency.reminder-interval=${URGENCY_REMINDER_INTERVAL:PT6H}
app.urgency.escalation-delay=${URGENCY_ESCALATION_DELAY:PT5M}
app.urgency.reminder-count=4
# The job runs every 60 s. Set false on every backend instance except one (or to disable reminders).
app.urgency.scheduler-enabled=${URGENCY_SCHEDULER_ENABLED:true}

