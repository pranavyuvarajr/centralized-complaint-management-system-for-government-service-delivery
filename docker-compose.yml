# One-command local stack: Postgres + Spring Boot backend + React frontend.
# Usage: docker compose up --build
# Frontend: http://localhost:5173   Backend: http://localhost:8080
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: complaint_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - complaint_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./complaint-management-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/complaint_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: LocalDevOnlySecretKeyChangeThisInProduction1234567890
      CORS_ORIGINS: http://localhost:5173
      PORT: 8080
      # Urgent-complaint alerts. Defaults are safe: mail is log-only until MAIL_ENABLED=true.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      URGENCY_REMINDER_INTERVAL: ${URGENCY_REMINDER_INTERVAL:-PT6H}
      URGENCY_ESCALATION_DELAY: ${URGENCY_ESCALATION_DELAY:-PT5M}
    ports:
      - "8080:8080"
    volumes:
      - complaint_uploads:/app/uploads

  frontend:
    build:
      context: ./complaint-management-frontend
      args:
        VITE_API_URL: http://localhost:8080
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  complaint_db_data:
  complaint_uploads:
